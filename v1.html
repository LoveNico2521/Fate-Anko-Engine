<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>織夢者菲特《Fate》 - 劇情推演系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes roll3d {
      0% { transform: rotateX(0deg) rotateY(0deg) scale(0.9); opacity: 0.6; }
      50% { transform: rotateX(360deg) rotateY(180deg) scale(1.08); opacity: 0.95; }
      100% { transform: rotateX(720deg) rotateY(360deg) scale(1); opacity: 1; }
    }
    .animate-roll { animation: roll3d 0.45s ease-out; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex items-center justify-center p-2 md:p-4 font-sans overflow-x-hidden">

  <div class="w-full max-w-[1600px] md:aspect-video bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl flex flex-col p-4 md:p-6 space-y-4 overflow-hidden relative">
    
    <!-- 頂部標題列 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-3 gap-2">
      <div class="flex items-center gap-3">
        <div class="px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 rounded-xl text-indigo-400 font-black text-sm tracking-wider uppercase shadow-[0_0_10px_rgba(99,102,241,0.2)]">
          織夢機
        </div>
        <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent">
          織夢者菲特《Fate》
        </h1>
      </div>
      <div class="hidden md:flex text-xs text-slate-400 font-mono items-center gap-4">
        <span>ra (<= 目標值) / ro (>= 目標值) 雙檢定</span>
        <span>•</span>
        <span>與基準同向 ➔ 深入 (+1)</span>
        <span>•</span>
        <span>與基準反向 ➔ 退回 (-1)</span>
      </div>
    </div>

    <!-- 主內容區 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 flex-1 min-h-0">
      
      <!-- 左側：控制與參數設定欄 -->
      <div class="col-span-1 md:col-span-4 bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 md:p-5
